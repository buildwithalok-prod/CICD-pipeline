name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "Enviorment/**"
      - ".github/workflows/terraform.yml"

  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "Enviorment/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.13.3"
  TF_WORKING_DIR: "./Enviorment"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. Azure CLI se login
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "c687dd9f-ae6b-436b-87b0-5839044d6af5" \
            --password "9fe0d6ad-fcaf-463c-bb76-4ab2b42aa9ff" \
            --tenant "Rsk8Q~4snns3VuIe5nzzy1_-vUCaIrOzoBnSuaQu"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Enviorment/tfplan
          if-no-files-found: ignore